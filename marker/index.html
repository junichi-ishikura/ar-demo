<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>デモA: パネルにかざすと3Dが出る</title>
<link rel="stylesheet" href="../style.css">
<script src="../config.js"></script>
<!-- A-Frame 1.4.2 + MindAR 1.2.5 (動作確認済みの組み合わせ。latest にしない) -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<!-- animation-mixer (glb内蔵アニメの再生) -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="ar-common.js"></script>
</head>
<body class="ar">

<!-- 1) はじめる画面: ここで音声を解錠し、カメラ許可の心構えをつくる（省略しない） -->
<div class="gate" id="gate">
  <div class="board">
    <h2>デモA</h2>
    <p style="font-size:1.25rem;font-weight:800;margin:6px 0 10px">パネルにかざすと 3D が出て、音が鳴る</p>
    <ul>
      <li>次の画面で <strong>カメラを許可</strong> してください</li>
      <li><strong>音が出ます</strong>（マナーモードだと鳴らないことがあります）</li>
      <li>マーカー（印刷した紙 or 画面の画像）を用意してください</li>
    </ul>
  </div>
  <button class="btn red block" id="start-btn">はじめる</button>
  <p style="text-align:center;margin-top:16px"><a href="../">‹ トップにもどる</a></p>
</div>

<!-- 2) 画面上のUI -->
<div class="hud-top">
  <a class="btn white back" href="../">‹ もどる</a>
  <span class="name">デモA　3D＋音声</span>
</div>
<div class="hud-bottom">
  <div class="status" id="status">読み込み中…</div>
  <div class="caption" id="caption"></div>
</div>

<!-- 音（HTMLのaudioで鳴らす。A-Frameのsoundは iOS で不安定なので使わない） -->
<audio id="sfx-main" preload="auto"></audio>
<audio id="sfx-tap" preload="auto"></audio>
<audio id="sfx-depart" preload="auto"></audio>

<!-- 3) ARシーン -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="model" src=""></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"
            cursor="fuse: false; rayOrigin: mouse;"
            raycaster="far: 10000; objects: .clickable"></a-camera>

  <!-- 3枚のマーカーどれでも同じものが出る（targets.mind に3枚まとめてある） -->
  <a-entity mindar-image-target="targetIndex: 0"></a-entity>
  <a-entity mindar-image-target="targetIndex: 1"></a-entity>
  <a-entity mindar-image-target="targetIndex: 2"></a-entity>
</a-scene>

<script>
(function () {
  const C = CONFIG.markerDemo;
  document.getElementById('caption').textContent = C.caption || '';
  document.title = 'デモA: ' + (C.caption || '');

  const sfxMain = document.getElementById('sfx-main');
  const sfxTap = document.getElementById('sfx-tap');
  const sfxDepart = document.getElementById('sfx-depart');
  if (C.audio) sfxMain.src = C.audio;
  if (C.tapSound) sfxTap.src = C.tapSound;

  // 発車モードの設定（config.js の markerDemo.departure）
  const D = Object.assign({ enabled: false, delay: 1.5, distance: 4, duration: 4, direction: 'away', facing: 0, shrink: true, sound: '', message: '' }, C.departure || {});
  const departOn = !!D.enabled;
  if (departOn && D.sound) sfxDepart.src = D.sound;
  // 走る向き（モデルを載せたグループの座標。away = パネルの奥、toward = 手前）
  const DIRS = { away: [0, 0, -1], toward: [0, 0, 1], left: [-1, 0, 0], right: [1, 0, 0] };
  const dir = DIRS[D.direction] || DIRS.away;
  let departTimer = null;
  const departModels = [];   // 各マーカー上のモデル（発車の開始・リセット用）
  document.getElementById('model').setAttribute('src', C.model);

  // パネルの置き方: 机に置く(table)ならモデルを紙から「立ち上げる」、壁に貼る(wall)ならそのまま
  const placement = C.placement || 'table';
  const groupRotation = placement === 'wall' ? '0 0 0' : '90 0 0';

  const scale = Number(C.scale) || 1;
  const y = Number(C.yOffset) || 0;
  let clipIndex = 0;
  let clipNames = [];

  AR.attachToAllTargets((target) => {
    const group = document.createElement('a-entity');
    group.setAttribute('rotation', groupRotation);
    group.setAttribute('position', '0 0 0');

    // 3Dモデル
    const model = document.createElement('a-entity');
    model.setAttribute('gltf-model', '#model');
    model.setAttribute('class', 'clickable');
    model.setAttribute('position', `0 ${y} 0`);
    model.setAttribute('scale', `${scale} ${scale} ${scale}`);
    // タップで跳ねる
    model.setAttribute('animation__bounce', `property: object3D.position.y; from: ${y}; to: ${y + 0.25}; dur: 180; dir: alternate; loop: 1; easing: easeOutQuad; startEvents: bounce`);
    if (departOn) {
      model.setAttribute('rotation', `0 ${Number(D.facing) || 0} 0`);
      armDeparture(model);
      departModels.push(model);
    }
    model.addEventListener('model-loaded', (e) => {
      const anims = (e.detail.model && e.detail.model.animations) || [];
      clipNames = anims.map(a => a.name);
      if (anims.length && C.animation !== 'none') {
        const clip = C.animation && clipNames.includes(C.animation) ? C.animation : clipNames[0];
        clipIndex = clipNames.indexOf(clip);
        model.setAttribute('animation-mixer', `clip: ${clip}; loop: repeat`);
      } else if (!departOn && (Number(C.rotationSpeed) || 0) > 0) {
        // アニメが無ければY軸回転
        model.setAttribute('animation__spin', `property: rotation; to: 0 360 0; loop: true; dur: ${Math.round(360 / Number(C.rotationSpeed) * 1000)}; easing: linear`);
      }
    });
    model.addEventListener('click', () => {
      model.emit('bounce');
      AR.playAudio(sfxTap);
      // アニメがあれば次のアニメに切り替える（Walk → Run → Survey …）
      if (clipNames.length > 1 && C.animation !== 'none') {
        clipIndex = (clipIndex + 1) % clipNames.length;
        model.setAttribute('animation-mixer', `clip: ${clipNames[clipIndex]}; loop: repeat`);
      }
    });
    group.appendChild(model);

    // 吹き出し（モデルの右上に浮かべる）
    if (C.bubble) {
      const bubble = document.createElement('a-plane');
      bubble.setAttribute('width', '0.9');
      bubble.setAttribute('height', '0.45');
      bubble.setAttribute('position', `0.55 ${y + 0.55 * scale + 0.15} 0`);
      bubble.setAttribute('text-board', { text: C.bubble, style: 'bubble', fontSize: 84 });
      bubble.setAttribute('animation__in', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 350; easing: easeOutBack; startEvents: show');
      bubble.setAttribute('scale', '0 0 0');
      group.appendChild(bubble);
      target.addEventListener('targetFound', () => bubble.emit('show'));
    }

    // 影代わりの薄い円（紙の上に載っている感じを出す）
    const shadow = document.createElement('a-circle');
    shadow.setAttribute('radius', 0.28 * scale);
    shadow.setAttribute('rotation', '-90 0 0');
    shadow.setAttribute('position', '0 0.005 0');
    shadow.setAttribute('material', 'color: #141414; opacity: 0.25; transparent: true');
    if (placement === 'wall') shadow.setAttribute('visible', 'false');
    group.appendChild(shadow);

    target.appendChild(group);
  }, {
    onFound() {
      AR.playAudio(sfxMain); if (C.speakCaption) AR.speak(C.caption);
      if (departOn) {
        // 認識するたびに出発位置に戻してから、delay 秒後に発車
        resetDeparture();
        departTimer = setTimeout(() => {
          departTimer = null;
          AR.playAudio(sfxDepart);
          departModels.forEach(m => m.emit('depart'));
          if (D.message) AR.setStatus(D.message, 'found');
        }, (Number(D.delay) || 0) * 1000);
      }
    },
    onLost() {
      AR.stopAudio(sfxMain); AR.stopSpeak();
      if (departOn) { AR.stopAudio(sfxDepart); resetDeparture(); }
    },
  });

  // 発車アニメーションを（再）セットする。startEvents: depart で走り出す
  function armDeparture(model) {
    const dist = Number(D.distance) || 0;
    const dur = Math.max(100, (Number(D.duration) || 1) * 1000);
    const to = `${dir[0] * dist} ${y + dir[1] * dist} ${dir[2] * dist}`;
    model.setAttribute('animation__depart', `property: position; from: 0 ${y} 0; to: ${to}; dur: ${dur}; easing: easeInQuad; startEvents: depart`);
    if (D.shrink) {
      const s2 = scale * 0.35;
      model.setAttribute('animation__shrink', `property: scale; from: ${scale} ${scale} ${scale}; to: ${s2} ${s2} ${s2}; dur: ${dur}; easing: easeInQuad; startEvents: depart`);
    }
  }
  // 出発位置に戻す（マーカーを外したとき・再認識したとき）
  function resetDeparture() {
    if (departTimer) { clearTimeout(departTimer); departTimer = null; }
    departModels.forEach(m => {
      m.removeAttribute('animation__depart');
      m.removeAttribute('animation__shrink');
      m.setAttribute('position', `0 ${y} 0`);
      m.setAttribute('scale', `${scale} ${scale} ${scale}`);
      armDeparture(m);
    });
  }

  AR.setupGate({ audios: [sfxMain, sfxTap, sfxDepart] });
})();
</script>
</body>
</html>
